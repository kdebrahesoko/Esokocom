openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: advisories
    description: Farm advisories
  - name: market-prices
    description: Market price data
  - name: sms-alerts
    description: SMS alert notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /advisories:
    get:
      operationId: listAdvisories
      tags: [advisories]
      summary: List advisories
      description: Returns all farm advisories ordered by date descending
      responses:
        "200":
          description: List of advisories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdvisoryItem"
    post:
      operationId: createAdvisory
      tags: [advisories]
      security:
        - sessionCookie: []
        - legacyAdminCookie: []
      summary: Create an advisory
      description: Creates a farm advisory. Requires authenticated content staff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvisoryInput"
      responses:
        "201":
          description: Created advisory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /advisories/{id}:
    put:
      operationId: updateAdvisory
      tags: [advisories]
      security:
        - sessionCookie: []
        - legacyAdminCookie: []
      summary: Update an advisory
      description: Updates an existing farm advisory. Requires authenticated content staff.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvisoryUpdate"
      responses:
        "200":
          description: Updated advisory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAdvisory
      tags: [advisories]
      security:
        - sessionCookie: []
        - legacyAdminCookie: []
      summary: Delete an advisory
      description: Deletes an existing farm advisory. Requires authenticated content staff.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Advisory deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /market-prices:
    get:
      operationId: listMarketPrices
      tags: [market-prices]
      summary: List market prices
      description: Returns current market prices for all tracked commodities
      responses:
        "200":
          description: List of market prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketPriceItem"
    post:
      operationId: createMarketPrice
      tags: [market-prices]
      security:
        - sessionCookie: []
        - legacyAdminCookie: []
      summary: Create a market price
      description: Creates a market price record. Requires authenticated content staff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketPriceInput"
      responses:
        "201":
          description: Created market price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPriceItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /market-prices/{id}:
    put:
      operationId: updateMarketPrice
      tags: [market-prices]
      security:
        - sessionCookie: []
        - legacyAdminCookie: []
      summary: Update a market price
      description: Updates an existing market price record. Requires authenticated content staff.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketPriceUpdate"
      responses:
        "200":
          description: Updated market price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPriceItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMarketPrice
      tags: [market-prices]
      security:
        - sessionCookie: []
        - legacyAdminCookie: []
      summary: Delete a market price
      description: Deletes an existing market price record. Requires authenticated content staff.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Market price deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /sms-alerts:
    get:
      operationId: listSmsAlerts
      tags: [sms-alerts]
      summary: List SMS alerts
      description: Returns SMS alerts ordered by timestamp descending
      responses:
        "200":
          description: List of SMS alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmsAlertItem"
    post:
      operationId: createSmsAlert
      tags: [sms-alerts]
      security:
        - sessionCookie: []
        - legacyAdminCookie: []
      summary: Create an SMS alert
      description: Creates an SMS alert record. Requires authenticated content staff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsAlertInput"
      responses:
        "201":
          description: Created SMS alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsAlertItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sms-alerts/{id}:
    put:
      operationId: updateSmsAlert
      tags: [sms-alerts]
      security:
        - sessionCookie: []
        - legacyAdminCookie: []
      summary: Update an SMS alert
      description: Updates an existing SMS alert record. Requires authenticated content staff.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsAlertUpdate"
      responses:
        "200":
          description: Updated SMS alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsAlertItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSmsAlert
      tags: [sms-alerts]
      security:
        - sessionCookie: []
        - legacyAdminCookie: []
      summary: Delete an SMS alert
      description: Deletes an existing SMS alert record. Requires authenticated content staff.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: SMS alert deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: esoko_sess
      description: Named-user staff session cookie.
    legacyAdminCookie:
      type: apiKey
      in: cookie
      name: esoko_admin_sess
      description: Legacy super-admin session cookie retained for backward compatibility.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    AdvisoryInput:
      type: object
      properties:
        category:
          type: string
          enum: [weather, pest, market, nutrition, climate]
        title:
          type: string
          minLength: 1
          maxLength: 500
        body:
          type: string
          minLength: 1
          maxLength: 10000
        date:
          type: string
          format: date
      required: [category, title, body, date]

    AdvisoryUpdate:
      type: object
      properties:
        category:
          type: string
          enum: [weather, pest, market, nutrition, climate]
        title:
          type: string
          minLength: 1
          maxLength: 500
        body:
          type: string
          minLength: 1
          maxLength: 10000
        date:
          type: string
          format: date
      minProperties: 1

    MarketPriceInput:
      type: object
      properties:
        commodity:
          type: string
          minLength: 1
          maxLength: 200
        price:
          type: number
          minimum: 0
        unit:
          type: string
          minLength: 1
          maxLength: 100
        currency:
          type: string
          minLength: 1
          maxLength: 10
        trend:
          type: string
          enum: [up, down, stable]
        changePercent:
          type: number
        market:
          type: string
          minLength: 1
          maxLength: 200
        updatedAt:
          type: string
          format: date
      required: [commodity, price, unit, currency, trend, changePercent, market, updatedAt]

    MarketPriceUpdate:
      type: object
      properties:
        commodity:
          type: string
          minLength: 1
          maxLength: 200
        price:
          type: number
          minimum: 0
        unit:
          type: string
          minLength: 1
          maxLength: 100
        currency:
          type: string
          minLength: 1
          maxLength: 10
        trend:
          type: string
          enum: [up, down, stable]
        changePercent:
          type: number
        market:
          type: string
          minLength: 1
          maxLength: 200
        updatedAt:
          type: string
          format: date
      minProperties: 1

    SmsAlertInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1600
        type:
          type: string
          enum: [advisory, market, weather, survey, pest]
        timestamp:
          type: string
          format: date-time
      required: [message, type, timestamp]

    SmsAlertUpdate:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1600
        type:
          type: string
          enum: [advisory, market, weather, survey, pest]
        timestamp:
          type: string
          format: date-time
      minProperties: 1

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AdvisoryItem:
      type: object
      properties:
        id:
          type: integer
        category:
          type: string
          enum: [weather, pest, market, nutrition, climate]
        title:
          type: string
        body:
          type: string
        date:
          type: string
          description: ISO date string (YYYY-MM-DD)
      required:
        - id
        - category
        - title
        - body
        - date

    MarketPriceItem:
      type: object
      properties:
        id:
          type: integer
        commodity:
          type: string
        price:
          type: number
        unit:
          type: string
        currency:
          type: string
        trend:
          type: string
          enum: [up, down, stable]
        changePercent:
          type: number
        market:
          type: string
        updatedAt:
          type: string
          description: ISO date string (YYYY-MM-DD)
      required:
        - id
        - commodity
        - price
        - unit
        - currency
        - trend
        - changePercent
        - market
        - updatedAt

    SmsAlertItem:
      type: object
      properties:
        id:
          type: integer
        message:
          type: string
        type:
          type: string
          enum: [advisory, market, weather, survey, pest]
        timestamp:
          type: string
          description: ISO datetime string
      required:
        - id
        - message
        - type
        - timestamp
