kind = "web"
previewPath = "/"
title = "Esoko Website"
version = "1.0.0"
id = "artifacts/esoko-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23195

[services.development]
run = "pnpm --filter @workspace/esoko-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/esoko-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/esoko-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23195"
BASE_PATH = "/"
